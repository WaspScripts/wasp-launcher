name: "Publish"

on:
  workflow_run:
    workflows: ["Bump Version"]
    types:
      - completed

jobs:
  publish-tauri:
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.repository_owner == 'WaspScripts' }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "windows-latest"
            args: ""
          - platform: "ubuntu-22.04"
            args: "--bundles appimage,deb"
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v5

      - name: install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: pnpm/action-setup@v4
        name: Install pnpm
        with:
          version: 10
          run_install: false

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: "pnpm"

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: install frontend dependencies
        run: pnpm install

      - uses: tauri-apps/tauri-action@v0.6.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        with:
          tagName: wasp-launcher-v__VERSION__
          releaseName: "WaspLauncher v__VERSION__"
          releaseBody: "See the assets to download this version and install."
          assetNamePattern: "[name].[ext]"
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}

  notify:
    needs: publish-tauri
    if: ${{ always() && github.event.workflow_run.conclusion == 'success' && github.repository_owner == 'WaspScripts' }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
    steps:
      - name: Discord notification
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WEBHOOK: ${{ secrets.UPDATES_WEBHOOK }}
          COMMIT_MESSAGE: ${{ github.event.workflow_run.head_commit.message }}
          COMMIT_ID: ${{ github.event.workflow_run.head_commit.id }}
          COMMIT_AUTHOR: ${{ github.event.workflow_run.head_commit.author.name }}
        run: |
          JOBS=$(gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/jobs" --paginate)

          status() {
            local c
            c=$(jq -r --arg n "publish-tauri ($1)" '.jobs[] | select(.name == $n) | .conclusion' <<< "$JOBS" | head -n1)
            [ "$c" = "success" ] && echo "success" || echo "failed"
          }

          WIN=$(status windows-latest)
          LIN=$(status ubuntu-22.04)

          line() {
            # diff code blocks render "+" lines green and "-" lines red in Discord
            if [ "$2" = "success" ]; then echo "+ $1: successful"; else echo "- $1: failed"; fi
          }

          if [ "$WIN" = "success" ] && [ "$LIN" = "success" ]; then
            COLOR=5763719   # green
          elif [ "$WIN" = "failed" ] && [ "$LIN" = "failed" ]; then
            COLOR=15548997  # red
          else
            COLOR=16742912  # orange
          fi

          DESC=$(printf '%s\n\n```diff\n%s\n%s\n```\nDownload: https://github.com/WaspScripts/wasp-launcher/releases/latest' \
            "$COMMIT_MESSAGE" "$(line Windows "$WIN")" "$(line Linux "$LIN")")

          BODY=$(jq -nc \
            --arg title "WaspLauncher Updated" \
            --arg desc "$DESC" \
            --arg url "https://github.com/WaspScripts/wasp-launcher/commit/$COMMIT_ID" \
            --arg foot "Author: $COMMIT_AUTHOR" \
            --argjson color "$COLOR" \
            '{embeds:[{title:$title,description:$desc,url:$url,color:$color,footer:{text:$foot}}]}')
          curl -H "Content-Type: application/json" -d "$BODY" "$WEBHOOK"
